version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: synclife-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synclife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synclife}
      POSTGRES_DB: ${POSTGRES_DB:-synclife}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-synclife}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
